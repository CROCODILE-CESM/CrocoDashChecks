# The matrix: one row per grid, and what runs on it, in two parts.
#
#   testing:      places CrocoDash must work (a coast, both seams, both poles),
#                 every step on each, CESM runs included. Every week.
#   performance:  sizes, for the Performance page's fits, and the sweeps
#                 test_workflow.py runs on a few of them. On the first Monday of
#                 each month.
#
# Every row gets a real case, made by `crocodash create` from case.yaml plus the
# row; each forcing the row lists is processed on it with `crocodash process`; and
# with `cesm_runs: true`, every regional test compset in MOM_interface's
# testlist is built and run as a case on it (all in test_workflow.py, one job
# per row). To turn something on for a grid, add it to the row; to turn it off,
# delete it; to stop running a grid, delete its row.
#
#   about:     what the grid is for
#   grid:      a latitude/longitude box (xstart, lenx, ystart, leny and
#              resolution, in degrees; a fraction like 1/12 works), or a polar
#              stereographic square centred on a pole (crs, width_km,
#              resolution_km)
#   case:      changes to case.yaml for this row only
#   forcings:  the forcings to run on it, by their `crocodash process` flag:
#              bc (open boundaries) or runoff (runoff mapping)
#   cesm_runs: true to run MOM_interface's regional tests on it in CESM

# Full-resolution GEBCO (15 arcseconds), for the bathymetry fit. A polar cap,
# or a box past 40°, needs more memory than a node has.
full_gebco: &full_gebco
  topo: {source: {bathymetry_path: /glade/campaign/cesm/cesmdata/inputdata/ocn/mom/croc/crocogallerydata/gebco/GEBCO_2024.nc}}

testing:
  labrador:
    about: A coast with sea ice and rivers, with every step on it, CESM runs included
    grid: {xstart: 299.0, lenx: 5.0, ystart: 54.0, leny: 4.0, resolution: 0.25}
    forcings: [bc, runoff]
    cesm_runs: true
  equator_0e:
    about: All four hemispheres, across the prime meridian
    grid: {xstart: -5.0, lenx: 10.0, ystart: -5.0, leny: 10.0, resolution: 0.25}
    forcings: [bc]
  equator_180e:
    about: Across the antimeridian, at 180°E
    grid: {xstart: 175.0, lenx: 10.0, ystart: -5.0, leny: 10.0, resolution: 0.25}
    forcings: [bc, runoff]
    cesm_runs: true
  north_pole:
    about: Polar stereographic, centred on the North Pole
    grid: {crs: "EPSG:3995", width_km: 7000, resolution_km: 100}
    forcings: [bc]
  south_pole:
    about: Polar stereographic, centred on the South Pole, wide enough to reach the open ocean
    grid: {crs: "EPSG:3031", width_km: 7000, resolution_km: 100}
    forcings: [bc]

performance:
  # Sizes: squares of open ocean centred on 200°E, 0°N, at 0.1°, for the
  # open-boundary and bathymetry fits.
  pacific_2p5deg:
    about: 2.5° square
    grid: {xstart: 198.75, lenx: 2.5, ystart: -1.25, leny: 2.5, resolution: 0.1}
    case: *full_gebco
    forcings: [bc]
  pacific_10deg:
    about: 10° square; the open-boundary sweeps run on it
    grid: {xstart: 195.0, lenx: 10.0, ystart: -5.0, leny: 10.0, resolution: 0.1}
    case: *full_gebco
    forcings: [bc]
  pacific_20deg:
    about: 20° square
    grid: {xstart: 190.0, lenx: 20.0, ystart: -10.0, leny: 20.0, resolution: 0.1}
    case: *full_gebco
    forcings: [bc]
  pacific_40deg:
    about: 40° square; full GEBCO needs ~65 GB
    grid: {xstart: 180.0, lenx: 40.0, ystart: -20.0, leny: 40.0, resolution: 0.1}
    case: *full_gebco
    forcings: [bc]
  pacific_80deg:
    about: 80° square; the open-boundary worker sweep also runs on it
    grid: {xstart: 160.0, lenx: 80.0, ystart: -40.0, leny: 80.0, resolution: 0.1}
    forcings: [bc]
  # Coasts: from a 1° box on the Gulf of Mexico's southern coast (nested in
  # the Gulf) to the Indo-Pacific, at 1/12° like CROC's real cases there, for
  # the runoff-mapping fits.
  gulf_1deg:
    about: 1° box on the Gulf of Mexico's southern coast, at Coatzacoalcos
    grid: {xstart: 265.0, lenx: 1.0, ystart: 18.0, leny: 1.0, resolution: 1/12}
    forcings: [runoff]
  gulf_4deg:
    about: 4° box, same corner
    grid: {xstart: 265.0, lenx: 4.0, ystart: 18.0, leny: 4.0, resolution: 1/12}
    forcings: [runoff]
  gulf_of_mexico:
    about: The whole Gulf of Mexico; the runoff rmax sweep runs on it
    grid: {xstart: 262.0, lenx: 18.0, ystart: 18.0, leny: 13.0, resolution: 1/12}
    forcings: [runoff]
  north_atlantic:
    about: The North Atlantic
    grid: {xstart: 275.0, lenx: 80.0, ystart: 20.0, leny: 50.0, resolution: 1/12}
    forcings: [runoff]
  indo_pacific:
    about: The Indo-Pacific, sized like the CrocIndoPacific_112 case (2.4M cells); the rmax sweep runs on it
    grid: {xstart: 30.0, lenx: 160.0, ystart: -45.0, leny: 105.0, resolution: 1/12}
    forcings: [runoff]
