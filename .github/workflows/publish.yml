name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The data-access check runs daily on GLADE (data_access/cron_submit.sh) and
  # pushes data_access/health.json to main, which rebuilds the site.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # ref: main, so a run dispatched from another branch still publishes
      # main's results.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The weekly CESM-run job pushes its summary to the test-results
      # branch, not main; the page says "no results yet" if it's missing.
      - name: Fetch the weekly CESM-run results
        run: |
          git fetch --depth 1 origin test-results
          git show FETCH_HEAD:cesm_runs.json > cesm_runs/cesm_runs.json || rm -f cesm_runs/cesm_runs.json

      - name: Build the site
        run: python site/build_site.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/_build

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
