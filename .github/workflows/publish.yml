name: Publish site

on:
  # The checks push their results from GLADE to main (integration/ and
  # data_access/), and each push rebuilds the site.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # ref: main, so a run dispatched from another branch still publishes
      # main's results.
      - uses: actions/checkout@v4
        with:
          ref: main
          # The whole history: the Status page compares each suite's timings
          # with its past runs' committed integration/<suite>.json.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: site/requirements.txt

      - name: Install the site's packages
        run: pip install -r site/requirements.txt

      # Runs the page notebooks, which read the results JSON and draw the
      # tables and charts.
      - name: Build the site
        run: sphinx-build --fail-on-warning site site/_build/html

      - name: Write the README badges
        run: python site/write_badges.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/_build/html

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
