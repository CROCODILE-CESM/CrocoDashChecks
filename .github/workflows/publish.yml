name: Publish site

on:
  # The weekly checks push their results from GLADE: the workflow and the
  # data-access check to main, the CESM runs to test-results. Each push rebuilds
  # the site, always from main.
  push:
    branches: [main, test-results]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # ref: main, so a run dispatched from another branch still publishes
      # main's results.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: site/requirements.txt

      - name: Install the site's packages
        run: pip install -r site/requirements.txt

      # The weekly CESM-run job pushes its summary to the test-results
      # branch, not main; the page says "no results yet" if it's missing.
      - name: Fetch the weekly CESM-run results
        run: |
          git fetch --depth 1 origin test-results
          git show FETCH_HEAD:cesm_runs.json > integration/cesm_runs.json || rm -f integration/cesm_runs.json

      # Runs the page notebooks, which read the results JSON and draw the
      # tables and charts.
      - name: Build the site
        run: sphinx-build --fail-on-warning site site/_build/html

      - name: Write the README badges
        run: python site/write_badges.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/_build/html

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
